# Основной HTTP-сервер.
# Для включения HTTPS положите server-блок (пример в https.d/README.md)
# в каталог nginx/https.d — он подключится автоматически.

gzip on;
gzip_types text/plain text/css application/json application/javascript
           image/svg+xml application/xml;
gzip_min_length 1024;

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    client_max_body_size 5M;

    # Базовые security-заголовки
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ ^/(api|public)/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # Статика из общего тома с фронтенд-сборкой
    location / {
        root /var/www;
        index index.html index.htm;

        # Кэшируем ассеты с хешем, index.html отдаём без кэша,
        # чтобы пользователи сразу получали новые версии приложения
        location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        try_files $uri $uri/ /index.html;
    }
}

# Подключаем опциональные HTTPS-конфиги (см. README в nginx/https.d)
include /etc/nginx/conf.d/https.d/*.conf;
