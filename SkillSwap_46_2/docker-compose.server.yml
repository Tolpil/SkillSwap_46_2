name: skillswap-prod

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    image: ghcr.io/pr-month/skillswap-backend:latest
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - backend_uploads:/app/public
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  frontend:
    image: ghcr.io/pr-month/skillswap-frontend:latest
    restart: "no"
    volumes:
      - frontend_dist:/app/volume
    networks:
      - app-network

  nginx:
    image: ghcr.io/pr-month/skillswap-nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - frontend_dist:/var/www
      # Сюда можно положить server-блоки для HTTPS (см. nginx/https.d/README.md)
      - ./nginx/https.d:/etc/nginx/conf.d/https.d:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  frontend_dist:
  backend_uploads:
