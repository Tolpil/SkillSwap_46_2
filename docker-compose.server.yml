name: skillswap-prod

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - app-network

  backend:
    image: ghcr.io/pr-month/skillswap-backend:latest
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - backend_uploads:/app/public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    image: ghcr.io/pr-month/skillswap-frontend:latest
    restart: "no"
    volumes:
      - frontend_dist:/app/volume
    networks:
      - app-network

  nginx:
    image: ghcr.io/pr-month/skillswap-nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - frontend_dist:/var/www
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  frontend_dist:
  backend_uploads:
